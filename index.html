
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tableau Dashboards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1300px;
      margin: 40px auto;
      padding: 20px;
      background: #fafafa;
    }

    h1 {
      text-align: center;
    }

    p {
      text-align: center;
    }

    tableau-viz {
      display: block;
      width: 100%;
      height: 950px;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <h1>What Makes a Song Popular on Spotify?</h1>
  <p>Interactive Tableau dashboard exploring Spotify data.</p>

  <script type="module"
    src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js">
  </script>

  <tableau-viz
    id="spotifyDashboard"
    src="https://public.tableau.com/views/Week2SpotifyData/WhatmakesasongpopularonSpotify"
    toolbar="bottom"
    hide-tabs>
  </tableau-viz>

</body>
</html>
